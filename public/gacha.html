<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>扭蛋概率公示 · 喵击球</title><link rel="stylesheet" href="style.css">
<style>
table{width:100%;border-collapse:collapse}td,th{padding:6px 8px;border-bottom:1px solid #41365F;text-align:left}
.up{display:flex;gap:16px;align-items:center}.up img{width:96px;height:90px;image-rendering:pixelated}
.badge{background:var(--gold);color:var(--ink);padding:0 6px;border-radius:3px;font-weight:700;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}.grid div{text-align:center;font-size:13px}
.grid img{width:64px;height:60px;image-rendering:pixelated;display:block;margin:0 auto}
</style></head><body><div class="wrap">
<header><img src="icon.png" alt=""><div><h1>喵击球 MEOW SMASH</h1><div class="muted">扭蛋概率公示 · Gacha Rates Disclosure</div></div></header>
<nav><a href="./">首页 Home</a><a href="privacy.html">隐私政策</a><a href="terms.html">用户协议</a><a href="support.html">支持</a><a href="gacha">概率公示</a></nav>
<div id="app" class="card">加载中 Loading…</div>
<footer>本页与游戏内扭蛋使用同一份配置（数字签名下发）。数据每 5 分钟刷新。 · This page is generated from the same signed config the game uses. · <a href="https://www.deadlocksea.fun/" target="_blank" rel="noopener noreferrer">OUTSIDE 望野工作室</a></footer>
</div>
<script>
const fmt = t => new Date(t).toLocaleString('zh-CN', {timeZone:'Asia/Shanghai', hour12:false});
const day = t => new Date(t).toLocaleDateString('zh-CN', {timeZone:'Asia/Shanghai'});
Promise.all([fetch('/api/public').then(r=>r.json()), fetch('/api/cats').then(r=>r.json())]).then(([d, cats]) => {
  const c = d.config, by = Object.fromEntries(cats.map(x=>[x.id,x])), now = Date.now();
  const cur = c.banners.find(b => b.start <= now && now < b.end) || c.banners[1];
  const ev = c.events.find(e => e.start <= now && now < e.end);
  const pool = r => cats.filter(x => x.rarity===r && !x.exclusive);
  const eff = Object.assign({}, c.rates); if (ev) { eff.SSR += ev.ssrBonus; eff.N -= ev.ssrBonus; }
  let h = '';
  if (c.announcement) h += `<p><b>公告：</b>${c.announcement.replace(/</g,'&lt;')}</p>`;
  h += `<h2>本期 UP</h2><div class="up"><img src="cats/${cur.catId}.png"><div><span class="badge">SSR</span> <b style="font-size:22px">${by[cur.catId]?.zh||cur.catId}</b> ${by[cur.catId]?.en||''}<br>
  <span class="muted">${fmt(cur.start)} — ${fmt(cur.end)}（北京时间）</span><br>抽中 SSR 时有 <b>${Math.round(c.rateUp*100)}%</b> 为 UP 猫${c.guaranteeAfterMiss?'；若未中 UP，下一次 SSR 必定为 UP 猫':''}。</div></div>`;
  if (ev) h += `<p>🎉 <b>${ev.title}</b>（${fmt(ev.start)} — ${fmt(ev.end)}）：SSR 概率 +${ev.ssrBonus}%</p>`;
  h += `<h2>当前概率</h2><table><tr><th>稀有度</th><th>概率</th><th>可获得猫咪</th></tr>` + ['SSR','SR','R','N'].map(r =>
     `<tr><td>${r}</td><td><b>${eff[r]}%</b></td><td>${pool(r).map(x=>x.zh).join('、')}</td></tr>`).join('') + `</table>
     <p>保底：连续 <b>${c.pity}</b> 抽未出 SSR，第 ${c.pity} 抽必出 SSR。十连额外保底至少 1 个 SR 以上。同稀有度内每只猫概率均等（UP 规则除外）。限定猫（签到 / 通行证）不在卡池中。</p>`;
  if (c.scheduledRates.length) h += `<h2>预约变更（提前公示）</h2><ul>` + c.scheduledRates.map(s => `<li>${fmt(s.from)} 起：SSR ${s.rates.SSR}% · SR ${s.rates.SR}% · R ${s.rates.R}% · N ${s.rates.N}%，保底 ${s.pity}</li>`).join('') + `</ul>`;
  h += `<h2>UP 日程</h2><div class="grid">` + c.banners.filter(b => b.end > now).slice(0,8).map(b =>
     `<div><img src="cats/${b.catId}.png">${by[b.catId]?.zh||b.catId}<br><span class="muted">${day(b.start)} 起</span></div>`).join('') + `</div>`;
  const evs = c.events.filter(e => e.end > now);
  if (evs.length) h += `<h2>活动</h2><ul>` + evs.map(e => `<li>${e.title}：${fmt(e.start)} — ${fmt(e.end)}，SSR +${e.ssrBonus}%</li>`).join('') + `</ul>`;
  if (d.log.length) h += `<h2>变更记录</h2><ul class="muted">` + d.log.slice().reverse().slice(0,15).map(l => `<li>${fmt(Date.parse(l.at))} · ${l.summary}（${(l.changes||[]).join(', ')}）</li>`).join('') + `</ul>`;
  document.getElementById('app').innerHTML = h;
}).catch(e => document.getElementById('app').textContent = '加载失败：' + e);
</script></body></html>
